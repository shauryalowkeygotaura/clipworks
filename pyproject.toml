[project]
name = "clipworks"
version = "0.1.0"
description = "Long-form video to auto-posted vertical clips. Orchestrates publikclip."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipworks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
