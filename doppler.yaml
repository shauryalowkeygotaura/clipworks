# Doppler is capped at 10 projects on the free plan and the workplace is full,
# so clipworks has no project of its own. It borrows philosopher-pipeline/dev.
#
# Every clipworks secret is prefixed CLIPWORKS_ (CLIPWORKS_IG_ACCESS_TOKEN,
# CLIPWORKS_YT_REFRESH_TOKEN, ...). That is deliberate: philosopher-pipeline
# posts to its own Instagram account from this same config, and an unprefixed
# name shared by both projects would post one project's videos to the other's
# account. clipworks reads nothing from philosopher's INSTAGRAM_* keys.
#
# Reminder: this file alone does nothing. Run `doppler setup` in this dir.
setup:
  project: philosopher-pipeline
  config: dev
